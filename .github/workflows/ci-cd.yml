name: AlKhayma Resort CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # Frontend Lint & Test
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  # Backend Lint & Test
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: resort_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ./backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/resort_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-key
        run: pytest --tb=short -v

      - name: Check imports
        run: |
          python -c "from app.main import app; print('✅ Backend imports OK')"

  # AI Service Check
  ai-service-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check service file exists
        run: |
          test -f main.py && echo "✅ AI service main.py exists"

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

  # Deploy to Staging (on develop branch)
  deploy-staging:
    needs: [frontend-check, backend-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add staging deployment commands here
          echo "✅ Staging deployment complete"

  # Deploy to Production (on main branch)
  deploy-production:
    needs: [frontend-check, backend-check, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker images
        run: |
          echo "🐳 Building Docker images..."
          # docker build -t alkhayma/backend:${{ github.sha }} ./backend
          # docker build -t alkhayma/frontend:${{ github.sha }} ./frontend
          echo "✅ Docker images built"

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Add production deployment commands here
          # Example: SSH to server and pull new images
          echo "✅ Production deployment complete"

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          # curl -f https://api.alkhayma-resort.com/health
          echo "✅ Health checks passed"

      - name: Notify deployment
        if: always()
        run: |
          echo "📧 Sending deployment notification..."
          # Add notification logic (email, Slack, etc.)
